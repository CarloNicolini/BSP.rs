name: Bug report
description: Report a reproducible defect
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the formula/input, command or code, seed, and options.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the status/error and relevant execution metadata.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Package/tag/commit, OS, Python/Rust, backend, precision, and device.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What would demonstrate that the defect is fixed?
