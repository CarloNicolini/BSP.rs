name: Build and test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: bsp-rust
          - os: macos-latest
            binary: bsp-rust
          - os: windows-latest
            binary: bsp-rust.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Windows'
        run: choco install make -y --no-progress
      - run: cargo fmt --check
      - run: cargo fmt --manifest-path crates/bsp-cuda/Cargo.toml --check
      - run: cargo fmt --manifest-path crates/bsp-metal/Cargo.toml --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --release --locked
      - run: cargo test --doc --locked
      - run: cargo run --release --example solve_ksat -- examples/3sat.cnf
      - run: make rust BACKEND=cpu
      - uses: actions/upload-artifact@v7
        with:
          name: bsp-rust-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/${{ matrix.binary }}
            LICENSE
            NOTICE
            README.md
          if-no-files-found: error
