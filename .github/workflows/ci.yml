name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux CPU
            os: ubuntu-latest
            backend: cpu
          - name: macOS CPU
            os: macos-15
            backend: cpu
          - name: macOS Metal
            os: macos-15
            backend: metal
          - name: Linux CUDA
            os: ubuntu-22.04
            backend: cuda
            container: nvidia/cuda:12.6.3-devel-ubuntu22.04
    env:
      UV_PYTHON: '3.12'
      BSP_CUDA_ARCH: '61'
    steps:
      - name: Install CUDA container prerequisites
        if: matrix.backend == 'cuda'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates git build-essential pkg-config libssl-dev patchelf
          echo /usr/local/cuda/bin >> "$GITHUB_PATH"
          echo CUDA_HOME=/usr/local/cuda >> "$GITHUB_ENV"
          echo LD_LIBRARY_PATH=/usr/local/cuda/lib64 >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - name: Trust the container checkout for tests
        if: matrix.backend == 'cuda'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.backend }}
      - run: make ci BACKEND=${{ matrix.backend }}
      - uses: actions/upload-artifact@v7
        with:
          name: bsp-${{ runner.os }}-${{ matrix.backend }}
          path: |
            target/release/bsp-rust
            dist/*.whl
            LICENSE
            NOTICE
          if-no-files-found: error
