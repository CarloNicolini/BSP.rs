name: Python documentation
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
      - run: uv sync --extra docs --extra test --python 3.12
      - run: uv run python -m sphinx -W --keep-going -b html docs docs/_build/html
      - run: uv run python -m sphinx -W --keep-going -b doctest docs docs/_build/doctest
      - uses: actions/upload-artifact@v7
        with:
          name: bsp-python-documentation
          path: docs/_build/html/
          include-hidden-files: true
          if-no-files-found: error
