name: Repository policy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    name: Release policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.12'
      - run: uv run --no-project --python 3.12 python tools/check_release.py
      - run: uv run --no-project --python 3.12 python -m unittest discover -s tests/release_policy -v
