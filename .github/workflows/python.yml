name: Python tests and wheels
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra test --python ${{ matrix.python }}
      - run: uv run maturin build --release --locked --out dist
      - run: uv run maturin sdist --out dist
      - name: Install and test the built wheel
        run: |
          uv pip install --reinstall --no-deps dist/*.whl
          uv run --no-sync pytest -q tests/python
          uv run --no-sync python examples/solve.py examples/3sat.cnf
          uv run --no-sync python examples/solve.py
      - uses: actions/upload-artifact@v7
        with:
          name: pybsp-rust-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
