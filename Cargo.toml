[package]
name = "bsp-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-2.0-or-later"
description = "Native Rust Backtracking Survey Propagation for CNF SAT"
repository = "https://github.com/CarloNicolini/BSP.rs"
readme = "README.md"

[lib]
name = "bsp_rust"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "bsp-rust"
path = "src/main.rs"

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
rand = { version = "0.9.2", default-features = false, features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pyo3 = { version = "0.25.1", optional = true, features = ["abi3-py312"] }
numpy = { version = "0.25.0", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = 1
