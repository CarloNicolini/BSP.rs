<title id="chart-title">Measured speedup over C++ on Apple M1 Pro</title>
<desc id="chart-description">One verified solution per call, random 3-SAT at alpha 4. Six formula sizes from 500 to 20000 variables. CPU is fastest at small sizes; Metal reaches 12.68 times the C++ speed at 20000 variables. CUDA is unmeasured. The C++ benchmark requests one solution with whitening disabled.</desc>
