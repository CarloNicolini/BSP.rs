[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "pybsp-rust"
version = "0.1.0"
description = "Native Rust BSP solver with inspectable state"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
readme = "README.md"
dependencies = ["numpy>=2.0"]

[tool.maturin]
features = ["extension-module"]
module-name = "pybsp_rust.bsp_rust"
python-source = "python"
include = [
    { path = "crates/bsp-metal/Cargo.toml", format = "sdist" },
    { path = "crates/bsp-metal/build.rs", format = "sdist" },
    { path = "crates/bsp-metal/src/*", format = "sdist" },
    { path = "crates/bsp-cuda/Cargo.toml", format = "sdist" },
    { path = "crates/bsp-cuda/build.rs", format = "sdist" },
    { path = "crates/bsp-cuda/src/*", format = "sdist" },
]

[project.optional-dependencies]
test = ["pytest>=8", "maturin>=1.8,<2"]
docs = ["sphinx>=9.1,<10", "pydata-sphinx-theme>=0.23,<0.24", "sphinx-design>=0.6,<1"]

[project.urls]
Repository = "https://github.com/CarloNicolini/BSP.rs"
Issues = "https://github.com/CarloNicolini/BSP.rs/issues"
Documentation = "https://github.com/CarloNicolini/BSP.rs/tree/main/docs"
